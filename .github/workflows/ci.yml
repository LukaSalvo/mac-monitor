name: Dependency & Security Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Planification : tous les lundis à 8h00
    - cron: '0 8 * * 1'

jobs:
  check-dependencies:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2' # À ajuster selon votre version
        bundler-cache: true

    - name: Check for outdated gems
      run: |
        bundle outdated || echo "Certaines gems ne sont pas à jour."

    - name: Security Audit
      run: |
        gem install bundler-audit
        bundle-audit update
        bundle-audit check || echo "Vulnérabilités détectées dans les dépendances."