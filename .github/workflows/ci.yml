name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  # ÉTAPE 1 : Audit de sécurité
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Security Check
        run: |
          gem install bundler-audit
          bundle-audit update
          bundle-audit check

  # ÉTAPE 2 : Test de déploiement (Linux & Mac)
  deploy-test:
    needs: security-audit
    # On ne lance le test de déploiement que sur la branche master/main
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false # Si Linux échoue, on veut quand même voir si Mac réussit
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Installation de Ruby indispensable sur chaque machine de la matrice
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run Deployment Script
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh