name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Security Check
        run: |
          gem install bundler-audit
          bundle-audit update
          bundle-audit check

  deploy-test:
    needs: security-audit
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      important_changes: ${{ steps.filter.outputs.important }}
    steps:
      - uses: actions/checkout@v4

      # Détection des changements dans les fichiers critiques
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            important:
              - 'app.rb'
              - 'deploy.sh'
              - 'install_service.sh'
              - 'public/**'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Run Deployment Script (Test Mode)
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh

  create-tag:
    needs: deploy-test
    # Création du tag uniquement si changement important sur la branche principale
    if: github.ref == 'refs/heads/master' && needs.deploy-test.outputs.important_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and Push Tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEW_PATCH=$((patch + 1))
          NEW_TAG="v$major.$minor.$NEW_PATCH"
          
          echo "Version update: $LATEST_TAG -> $NEW_TAG"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG